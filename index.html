<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grid Export</title>
<!-- Generic by design: this same file runs unmodified on every dashboard.
     Do not hardcode a report name anywhere below. -->

<!-- Both libraries are served from this same folder. See SETUP.md step 1. -->
<script src="./tableau.extensions.1.latest.min.js"></script>
<script src="./xlsx.full.min.js"></script>

<style>
  :root {
    --ink:      #2c3e50;
    --muted:    #7f8c9a;
    --line:     #dfe4e8;
    --accent:   #4e79a7;
    --accent-d: #3d6088;
    --err:      #b5453b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
    font: 13px/1.4 "Benton Sans", "Segoe UI", Tahoma, sans-serif;
    color: var(--ink); background: transparent;
  }
  #go {
    flex: 1; min-height: 38px; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 8px 14px;
    border: 1px solid var(--accent); border-radius: 3px;
    background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
    transition: background .12s ease;
  }
  #go:hover:not(:disabled) { background: var(--accent-d); border-color: var(--accent-d); }
  #go:disabled { opacity: .55; cursor: default; }
  #go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #go .sub {
    font-size: 11px; font-weight: 400; opacity: .85;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #status { font-size: 11px; color: var(--muted); text-align: center; min-height: 14px; }
  #status.error { color: var(--err); }
  #diagWrap { display: none; font-size: 11px; color: var(--muted); }
  body.debug #diagWrap { display: block; }
  pre {
    background: #f5f6f7; border: 1px solid var(--line); border-radius: 3px;
    padding: 6px; margin: 4px 0 0; overflow: auto; max-height: 220px; font-size: 11px;
  }
  @media (prefers-reduced-motion: reduce) { #go { transition: none; } }

  /* ---------- Configure dialog ---------- */
  body.cfg-body { padding: 0; background: #fff; }
  .cfg { height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; }
  .cfg .field { display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
  .cfg select {
    font: inherit; font-weight: 400; color: var(--ink);
    padding: 5px 6px; border: 1px solid var(--line); border-radius: 3px; background: #fff;
  }
  .cols { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .cols-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .cols-head strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .list { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 3px; }
  .group {
    position: sticky; top: 0; padding: 5px 10px; font-size: 11px; color: var(--muted);
    background: #f5f6f7; border-bottom: 1px solid var(--line);
  }
  .item {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px;
    border-bottom: 1px solid #f0f2f4; cursor: pointer;
  }
  .item:hover { background: #f8f9fa; }
  .item input { margin: 0; accent-color: var(--accent); }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.off .name { color: var(--muted); text-decoration: line-through; }
  .item.locked { cursor: default; color: var(--muted); }
  .item .detail { margin-left: auto; padding-left: 8px; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .list .msg { padding: 10px; color: var(--muted); }
  .list .msg.error { color: var(--err); }
  .warn {
    padding: 7px 10px; font-size: 12px; color: var(--err);
    background: #fbf1f0; border: 1px solid #f0d4d1; border-radius: 3px;
  }
  .warn[hidden] { display: none; }
  .hint { margin: 0; font-size: 11px; color: var(--muted); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .btn {
    font: inherit; padding: 6px 14px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-d); border-color: var(--accent-d); }
  .btn.quiet { margin-right: auto; border-color: transparent; color: var(--accent); padding-left: 0; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<button id="go" disabled>
  <span id="label">Download Excel</span>
  <span class="sub" id="sub">Starting…</span>
</button>
<div id="status"></div>

<div id="diagWrap">
  <details open><summary>Diagnostics</summary><pre id="diag">–</pre></details>
</div>

<script>
/* ============================================================
   CONFIG

   Headers come from each parameter's own display alias, so no
   number->attribute mapping is stored here. Works unchanged in
   any workbook, whatever each CASE statement maps to.
   ============================================================ */

// Each entry below is an "axis" of dynamic column: a field whose header
// should come from a parameter rather than its own name. Grid Level fields
// pair by number (1-9); Metric Selector fields have no number and pair
// one-to-one within a prefix, since a report typically has just one.
// Add a line here for any future selector type using the same convention.
const AXES = [
  { name: "gridLevel",      pattern: /grid\s*level\s*([1-9])/i },
  { name: "metricSelector", pattern: /metric\s*selector\s*([1-9])?/i }
];

// Fields matching this are pure sort-helpers (e.g. "AGG(Kp.06 Metric Sort)")
// and are dropped from every export, regardless of value or axis matching.
const SORT_FIELD_PATTERN = /\bsort\b/i;

// Parameter labels meaning "no attribute at this level". Case-insensitive.
// Columns for these levels are omitted from the export.
const NONE_LABELS = ["", "none", "n/a", "-"];

// Only used if a parameter has NO display alias and returns a bare number.
// Leave empty unless you hit that; Diagnostics will tell you.
const FALLBACK_LEVEL_NAMES = {};

// Turn Measure Names / Measure Values into one column per measure.
const PIVOT_MEASURES = true;

// Manual override, only if you need a column order different from what's
// already in the view. Leave empty (default) — measures then export
// left-to-right exactly as they appear in the dashboard's Measure Values
// shelf, however many there are, with no per-report edit needed.
const MEASURE_ORDER = [];

// Decimal separator used in Tableau's formatted numbers, for reading
// precision back off them (see decimalsOf below). "." matches every
// screenshot seen so far; change to "," for an EU-formatted report.
const DECIMAL_SEPARATOR = ".";

// Field names never exported, on any dashboard.
const DROP_FIELDS = [];

// Filename prefix. "auto" uses the dashboard name.
const FILE_STEM = "auto";

// Workbook setting holding per-sheet exclusions chosen in Configure:
//   { "<sheet name>": { columns: ["Grid Index", ...], measures: ["Avg Bet Eur", ...] } }
// Columns are keyed by field name (stable even when a Grid Level parameter
// changes its label); measures by their Measure Names value. Only exclusions
// are stored, so a pill added to the sheet later exports by default.
const EXCLUDE_KEY = "excludeBySheet";

// Workbook setting: which parameter set (report prefix) drives each sheet's
// Grid Level / Metric Selector columns, chosen in Configure.
//   { "<sheet name>": "kp.03" }      absent or "" = work it out automatically
// Lets grid fields keep clean names ("Grid Level 1") in the view's headers.
const PARAM_SET_KEY = "paramSetBySheet";

// Rows read by the Configure dialog to discover a sheet's measures. One page
// is enough: every row group carries every measure in the Measure Values shelf.
const CONFIG_SAMPLE_ROWS = 2000;

/* ============================================================ */

const $ = id => document.getElementById(id);
let dashboard = null, diagText = "";

if (new URLSearchParams(location.search).get("debug") === "1") {
  document.body.classList.add("debug");
}

const setStatus = (msg, isError) => {
  $("status").textContent = msg || "";
  $("status").className = isError ? "error" : "";
};
const setDiag = t => { diagText = t; $("diag").textContent = t; };

// Collapses any run of whitespace — including the non-breaking spaces
// Tableau's UI sometimes inserts — into a single normal space. Matching
// runs against this, so an invisible character difference between a field
// name and its parameter can't silently break the pairing.
const norm = s => String(s || "").replace(/[\s\u00A0]+/g, " ").trim();

// Matched slot within one axis: the captured number for Grid Level fields,
// or "_" for axes like Metric Selector whose pattern has no number group.
// null means "doesn't belong to this axis at all".
const slotOf = (name, pattern) => {
  const m = pattern.exec(norm(name));
  return m ? (m[1] || "_") : null;
};
const isSelectorField = name => AXES.some(a => slotOf(name, a.pattern) != null);
const isSortField = name => SORT_FIELD_PATTERN.test(norm(name));

// "Fi.03 Grid Level 1" -> "fi.03"   |   "SUM(Kp.06 Metric Selector)" -> "kp.06"
const prefixOf = name => {
  const m = /([A-Za-z]+\.[A-Za-z0-9.]+)/.exec(norm(name));
  return m ? m[1].toLowerCase() : "";
};
const isNone = label => NONE_LABELS.includes(String(label ?? "").trim().toLowerCase());
const isMeasureNames  = f => /^measure\s*names$/i.test(f || "");
const isMeasureValues = f => /^measure\s*values$/i.test(f || "");

function readExcludes() {
  try {
    const all = JSON.parse(tableau.extensions.settings.get(EXCLUDE_KEY) || "{}");
    return all && typeof all === "object" ? all : {};
  } catch (e) { return {}; }
}
function excludesFor(sheetName) {
  const e = readExcludes()[sheetName] || {};
  return { columns: e.columns || [], measures: e.measures || [] };
}

// Digits after the decimal separator in Tableau's own formatted string,
// e.g. "132.56" -> 2, "1,070,061" -> 0, "95.1234%" -> 4. Ignores thousands
// separators, currency symbols and trailing % automatically, since it only
// looks at what follows DECIMAL_SEPARATOR. Returns null for non-strings.
function decimalsOf(formatted) {
  if (typeof formatted !== "string") return null;
  const parts = formatted.split(DECIMAL_SEPARATOR);
  if (parts.length < 2) return 0;
  return parts[parts.length - 1].replace(/[^0-9]/g, "").length;
}

// The label for a selector parameter: its display alias, or the fallback
// map if the parameter shows a bare number.
function labelOf(param) {
  const shown = String(param.currentValue.formattedValue ?? "").trim();
  if (shown && !/^-?\d+$/.test(shown)) return shown;
  const n = Number(param.currentValue.nativeValue ?? param.currentValue.value);
  return FALLBACK_LEVEL_NAMES[n] ?? shown;
}

function readParamSets() {
  try {
    const all = JSON.parse(tableau.extensions.settings.get(PARAM_SET_KEY) || "{}");
    return all && typeof all === "object" ? all : {};
  } catch (e) { return {}; }
}

// Report prefixes that own at least one selector parameter, lower-case key ->
// display form, e.g. "kp.03" -> "Kp.03". These are the parameter sets a
// sheet's grid columns can be driven by.
function paramFamilies(params) {
  const fam = new Map();
  params.forEach(p => {
    if (!isSelectorField(p.name)) return;
    const m = /([A-Za-z]+\.[A-Za-z0-9.]+)/.exec(norm(p.name));
    if (m && !fam.has(m[1].toLowerCase())) fam.set(m[1].toLowerCase(), m[1]);
  });
  return fam;
}

/* Which parameter set drives this sheet, for grid fields that carry no prefix
   of their own (e.g. plain "Grid Level 1", named that so the view's row
   headers read cleanly). In order of trust:
     1. the choice saved for this sheet in Configure
     2. the prefix of the sheet's other fields, when they all agree
        (e.g. "Kp.03 Title" on Detail)
     3. the sheet name, then the dashboard name ("Kp.03 Daily KPIs")
   If none of those settles it, prefix is "" and nothing is guessed.
   `override` (used by the Configure dialog) replaces the saved choice;
   pass "" to see what automatic detection would pick. */
function resolveParamSet(sheetName, fieldNames, params, override) {
  const fam = paramFamilies(params);
  const shown = p => fam.get(p) || p;
  const manual = override !== undefined ? override : (readParamSets()[sheetName] || "");
  if (manual && fam.has(manual)) return { prefix: manual, display: shown(manual), source: "set in Configure" };

  const byPrefix = new Map();               // prefix -> first field carrying it
  fieldNames.forEach(f => {
    const p = prefixOf(f);
    if (fam.has(p) && !byPrefix.has(p)) byPrefix.set(p, f);
  });
  if (byPrefix.size === 1) {
    const [[p, f]] = byPrefix;
    return { prefix: p, display: shown(p), source: "from field \u201C" + f + "\u201D" };
  }
  for (const [where, name] of [["sheet name", sheetName], ["dashboard name", dashboard?.name]]) {
    const p = prefixOf(name);
    if (fam.has(p)) return { prefix: p, display: shown(p), source: "from the " + where };
  }
  return { prefix: "", display: "", source: "",
           candidates: [...(byPrefix.size ? byPrefix.keys() : fam.keys())].map(shown) };
}

/* Pair each selector COLUMN (any axis) with the parameter driving it.
   Matching is by slot plus prefix: the column's own prefix if it has one
   ("Kp.06 Grid Level 1"), else the sheet's resolved parameter set. That's
   what keeps Kp.03 / Kp.04 / Kp.06 apart in one workbook. If neither gives
   an exact match, a parameter is used only when it's the ONLY one for that
   slot; otherwise the column stays unpaired (keeps its own name) rather
   than borrowing another report's labels. A field that matches no axis (a
   regular metric, e.g. plain "Bet Eur") is absent from the map too. */
function buildHeaderMap(fieldNames, params, sheetPrefix = "") {
  const map = {};
  AXES.forEach(axis => {
    const axisParams = params
      .map(p => ({ p, slot: slotOf(p.name, axis.pattern), prefix: prefixOf(p.name) }))
      .filter(x => x.slot != null);

    fieldNames.forEach(fn => {
      const slot = slotOf(fn, axis.pattern);
      if (slot == null) return;
      const own = prefixOf(fn);
      const prefix = own || sheetPrefix;
      const exact = prefix ? axisParams.find(x => x.slot === slot && x.prefix === prefix) : null;
      const sameSlot = axisParams.filter(x => x.slot === slot);
      const match = exact || (sameSlot.length === 1 ? sameSlot[0] : null);
      if (match) map[fn] = {
        label: labelOf(match.p), param: match.p.name, axis: axis.name,
        exact: !!exact, inferred: !!exact && !own
      };
    });
  });
  return map;
}

// Everything the export needs to name a sheet's columns, in one call.
function resolveHeaders(sheetName, fieldNames, params, override) {
  const set = resolveParamSet(sheetName, fieldNames, params, override);
  const map = buildHeaderMap(fieldNames, params, set.prefix);
  const unresolved = fieldNames.filter(f => isSelectorField(f) && !map[f]);
  return { map, set, unresolved };
}

const describeSet = set => set.prefix
  ? set.display + " (" + set.source + ")"
  : "unclear" + (set.candidates?.length ? " between " + set.candidates.join(", ") : "") +
    ". Pick one in Configure.";

async function columnNamesOf(ws) {
  try {
    if (typeof ws.getSummaryColumnsInfoAsync === "function") {
      return (await ws.getSummaryColumnsInfoAsync()).map(c => c.fieldName);
    }
  } catch (e) { /* not introspectable before export */ }
  return null;
}

// Pick the sheet holding the grid: most columns matching any axis pattern.
// `forced` defaults to the saved choice; the Configure dialog passes the
// dropdown's current value instead ("" = auto-detect).
async function pickWorksheet(forced = tableau.extensions.settings.get("sourceSheet")) {
  const sheets = dashboard.worksheets;
  if (forced) {
    const ws = sheets.find(w => w.name === forced);
    if (ws) return ws;              // explicit config wins
  }
  if (sheets.length === 1) return sheets[0];
  let best = null, bestScore = -1;
  for (const ws of sheets) {
    const names = await columnNamesOf(ws);
    const score = names ? names.filter(isSelectorField).length : 0;
    if (score > bestScore) { bestScore = score; best = ws; }
  }
  return best || sheets[0];
}

// Enables/disables the button based on whether a mark is selected on the
// configured "gate" sheet (e.g. the game-release table). No gate configured
// = always enabled, same as today.
async function updateGate() {
  const gateName = tableau.extensions.settings.get("gateSheet");
  if (!gateName) { $("go").disabled = false; return; }
  const gateWs = dashboard.worksheets.find(w => w.name === gateName);
  if (!gateWs) { $("go").disabled = false; return; }
  const marks = await gateWs.getSelectedMarksAsync();
  const hasSelection = marks.data.some(t => t.data.length > 0);
  $("go").disabled = !hasSelection;
  setStatus(hasSelection ? "" : "Make a selection first.");
}

// Fired by Tableau's "Configure..." menu item (registered in init() below).
async function openConfigureDialog() {
  const popupUrl = location.origin + location.pathname + "?configure=1";
  try {
    await tableau.extensions.ui.displayDialogAsync(popupUrl, "", { height: 680, width: 540 });
    await refresh();
    await updateGate();
  } catch (e) { /* user cancelled the dialog */ }
}

// Runs when this same file is loaded inside the config popup (see init()).
async function runConfigureDialog() {
  await tableau.extensions.initializeDialogAsync();
  dashboard = tableau.extensions.dashboardContent.dashboard;
  const names = dashboard.worksheets.map(w => w.name);
  const saved = readExcludes();
  const savedSets = readParamSets();
  const draftSet = {};       // sheet -> parameter set chosen here ("" = automatic)
  const setFor = sheet => sheet in draftSet ? draftSet[sheet] : (savedSets[sheet] || "");

  // Unsaved edits, per sheet, so switching the dropdown back and forth
  // doesn't lose ticks. Starts from what's saved for each sheet.
  const draft = {};
  const draftFor = sheet => draft[sheet] || (draft[sheet] = {
    columns:  new Set(saved[sheet]?.columns  || []),
    measures: new Set(saved[sheet]?.measures || [])
  });

  document.body.className = "cfg-body";
  document.body.innerHTML = `
    <div class="cfg">
      <label class="field">Sheet to export
        <select id="sheetPick"></select>
      </label>
      <label class="field">Parameter set for this sheet
        <select id="setPick"></select>
      </label>
      <label class="field">Require a selection on (optional)
        <select id="gatePick"></select>
      </label>
      <section class="cols" aria-labelledby="colsTitle">
        <div class="cols-head">
          <strong id="colsTitle">Columns</strong>
          <span class="count" id="colsCount"></span>
        </div>
        <div class="warn" id="setWarn" role="alert" hidden></div>
        <div class="list" id="colList"></div>
        <p class="hint">Unticked columns are left out of the export for this sheet only.
          Fields you add to the sheet later are included automatically.</p>
      </section>
      <div class="actions">
        <button class="btn quiet" id="allBtn" type="button">Include all</button>
        <button class="btn" id="cancelBtn" type="button">Cancel</button>
        <button class="btn primary" id="saveBtn" type="button">Save</button>
      </div>
    </div>`;

  const fill = (sel, first, values) => {
    [first, ...values.map(n => [n, n])].forEach(([v, l]) => sel.add(new Option(l, v)));
  };
  fill($("sheetPick"), ["", "Auto-detect"], names);
  fill($("gatePick"),  ["", "None"], names);
  $("sheetPick").value = tableau.extensions.settings.get("sourceSheet") || "";
  $("gatePick").value  = tableau.extensions.settings.get("gateSheet")  || "";

  let current = null;        // { sheet, items } currently shown
  let shownSheet = null;     // sheet whose parameter set the dropdown shows
  let loadToken = 0;         // ignores slow loads after the dropdown changed

  const message = (text, isError) => {
    const d = document.createElement("div");
    d.className = "msg" + (isError ? " error" : "");
    d.textContent = text;
    return d;
  };

  function updateCount() {
    if (!current) { $("colsCount").textContent = ""; return; }
    const d = draftFor(current.sheet);
    const live = current.items.filter(i => !i.locked && !i.stale);
    const on = live.filter(i => !d[i.kind].has(i.key) && !i.noneNow).length;
    $("colsCount").textContent = on + " of " + live.length + " exported";
  }

  function render(sheet, items, auto) {
    const d = draftFor(sheet);
    // Exclusions saved earlier for fields not in the view right now (filtered
    // out, or a measure temporarily removed). Kept, and shown so they can be cleared.
    ["columns", "measures"].forEach(kind => {
      d[kind].forEach(key => {
        if (!items.some(i => i.kind === kind && i.key === key)) {
          items.push({ kind, key, label: key, detail: "not in the view right now", stale: true });
        }
      });
    });
    current = { sheet, items };

    $("colsTitle").textContent = "Columns in \u201C" + sheet + "\u201D" + (auto ? " (auto-detected)" : "");
    const list = $("colList");
    list.replaceChildren();
    if (!items.length) { list.append(message("This sheet has no columns to export.")); updateCount(); return; }

    [["columns", "Fields"], ["measures", "Measures"]].forEach(([kind, title]) => {
      const group = items.filter(i => i.kind === kind);
      if (!group.length) return;
      const h = document.createElement("div");
      h.className = "group";
      h.textContent = title;
      list.append(h);

      group.forEach(item => {
        const row = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = item.label;
        name.title = item.key;
        row.append(box, name);
        if (item.detail) {
          const det = document.createElement("span");
          det.className = "detail";
          det.textContent = item.detail;
          row.append(det);
        }
        const sync = () => row.className = "item" + (item.locked ? " locked" : "") + (box.checked ? "" : " off");
        if (item.locked) {
          box.checked = false;
          box.disabled = true;
        } else {
          box.checked = !d[kind].has(item.key);
          box.onchange = () => {
            box.checked ? d[kind].delete(item.key) : d[kind].add(item.key);
            sync();
            updateCount();
          };
        }
        sync();
        list.append(row);
      });
    });
    updateCount();
  }

  async function load() {
    const token = ++loadToken;
    current = null;
    $("colList").replaceChildren(message("Reading columns\u2026"));
    updateCount();
    try {
      const choice = $("sheetPick").value;
      const ws = await pickWorksheet(choice);
      if (!ws) throw new Error("No worksheet found on this dashboard.");
      const params = await dashboard.getParametersAsync();
      const info = await readSheetItems(ws, params, setFor(ws.name));
      if (token !== loadToken) return;
      showParamSet(ws.name, info);
      render(ws.name, info.items, !choice);
    } catch (e) {
      if (token === loadToken) {
        $("colList").replaceChildren(message("Couldn't read this sheet's columns: " + e.message, true));
      }
    }
  }

  function showParamSet(sheet, info) {
    shownSheet = sheet;
    const sel = $("setPick");
    sel.replaceChildren();
    sel.add(new Option(info.auto.prefix
      ? "Automatic: " + info.auto.display + " (" + info.auto.source + ")"
      : "Automatic: couldn't tell", ""));
    info.families.forEach((display, key) => sel.add(new Option(display, key)));
    sel.value = info.families.has(setFor(sheet)) ? setFor(sheet) : "";

    const warn = $("setWarn");
    if (info.unresolved.length) {
      warn.textContent = "Can't tell which parameters drive " + info.unresolved.join(", ") +
        ", so they'd export under their field names. Pick a parameter set above.";
      warn.hidden = false;
    } else {
      warn.hidden = true;
    }
  }

  $("sheetPick").onchange = load;
  $("setPick").onchange = () => {
    if (shownSheet == null) return;
    draftSet[shownSheet] = $("setPick").value;
    load();
  };
  $("allBtn").onclick = () => {
    if (!current) return;
    const d = draftFor(current.sheet);
    d.columns.clear();
    d.measures.clear();
    render(current.sheet, current.items.filter(i => !i.stale), !$("sheetPick").value);
  };
  $("cancelBtn").onclick = () => tableau.extensions.ui.closeDialog("");
  $("saveBtn").onclick = async () => {
    $("saveBtn").disabled = true;
    try {
      const all = readExcludes();
      Object.entries(draft).forEach(([sheet, d]) => {
        const entry = { columns: [...d.columns], measures: [...d.measures] };
        if (entry.columns.length || entry.measures.length) all[sheet] = entry;
        else delete all[sheet];
      });
      tableau.extensions.settings.set("sourceSheet", $("sheetPick").value);
      tableau.extensions.settings.set("gateSheet", $("gatePick").value);
      tableau.extensions.settings.set(EXCLUDE_KEY, JSON.stringify(all));
      const sets = readParamSets();
      Object.entries(draftSet).forEach(([sheet, v]) => { if (v) sets[sheet] = v; else delete sets[sheet]; });
      tableau.extensions.settings.set(PARAM_SET_KEY, JSON.stringify(sets));
      await tableau.extensions.settings.saveAsync();
      tableau.extensions.ui.closeDialog("saved");
    } catch (e) {
      $("saveBtn").disabled = false;
      $("colsCount").textContent = "Save failed: " + e.message;
    }
  };

  await load();
}

// What the Configure checklist offers for one sheet: each column (with the
// header it currently exports under) plus, when measures are pivoted, each
// individual measure from Measure Values. Reads a single page of data.
async function readSheetItems(ws, params, paramSetOverride) {
  const reader = await ws.getSummaryDataReaderAsync(CONFIG_SAMPLE_ROWS);
  let columns, rows = [];
  try {
    if (reader.pageCount > 0) {
      const page = await reader.getPageAsync(0);
      columns = page.columns;
      rows = page.data;
    }
  } finally {
    await reader.releaseAsync();
  }
  if (!columns) {                     // empty sheet: no page to read
    columns = typeof ws.getSummaryColumnsInfoAsync === "function"
      ? await ws.getSummaryColumnsInfoAsync() : [];
  }

  const fieldNames = columns.map(c => c.fieldName);
  const res = resolveHeaders(ws.name, fieldNames, params, paramSetOverride);
  const auto = resolveParamSet(ws.name, fieldNames, params, "");
  const map = res.map;
  const nameCol = columns.find(c => isMeasureNames(c.fieldName));
  const pivoting = PIVOT_MEASURES && nameCol && columns.some(c => isMeasureValues(c.fieldName));
  const items = [];

  columns.forEach(c => {
    const f = c.fieldName;
    if (pivoting && (isMeasureNames(f) || isMeasureValues(f))) return;  // shown as measures below
    if (DROP_FIELDS.includes(f)) {
      items.push({ kind: "columns", key: f, label: f, detail: "always dropped", locked: true });
    } else if (isSortField(f)) {
      items.push({ kind: "columns", key: f, label: f, detail: "sort helper, always dropped", locked: true });
    } else {
      const hit = map[f];
      // A level set to None isn't exported right now, but stays tickable:
      // the choice applies again once the parameter picks an attribute.
      const noneNow = !!hit && isNone(hit.label);
      let detail = "";
      if (hit) detail = noneNow ? "level set to None" : "exports as \u201C" + hit.label + "\u201D";
      else if (isSelectorField(f)) detail = "no matching parameter";
      items.push({ kind: "columns", key: f, label: f, detail, noneNow });
    }
  });

  if (pivoting) {
    const seen = [];
    rows.forEach(r => {
      const m = r[nameCol.index].formattedValue;
      if (!seen.includes(m)) seen.push(m);
    });
    seen.forEach(m => items.push({ kind: "measures", key: m, label: m }));
  }
  return { items, set: res.set, auto, unresolved: res.unresolved, families: paramFamilies(params) };
}

(async function init() {
  if (typeof tableau === "undefined") {
    $("sub").textContent = "Library not loaded";
    setStatus("tableau.extensions.1.latest.min.js is missing from this folder.", true);
    return;
  }
  // this file also serves as the popup when "Configure..." is clicked
  if (new URLSearchParams(location.search).get("configure") === "1") {
    return runConfigureDialog();
  }

   try {
    // register the configure callback
    await tableau.extensions.initializeAsync({ configure: openConfigureDialog });
    dashboard = tableau.extensions.dashboardContent.dashboard;

    await refresh();

    const params = await dashboard.getParametersAsync();
    params.filter(p => isSelectorField(p.name)).forEach(p => {
      p.addEventListener(tableau.TableauEventType.ParameterChanged,
        () => refresh().catch(e => setStatus(e.message, true)));
    });

    const gateSheet = tableau.extensions.settings.get("gateSheet");
    if (gateSheet) {
      const gateWs = dashboard.worksheets.find(w => w.name === gateSheet);
      if (gateWs) gateWs.addEventListener(tableau.TableauEventType.MarkSelectionChanged, updateGate);
    }
    await updateGate();

    $("go").onclick = run;
  } catch (e) {
    $("sub").textContent = "Not connected";
    setStatus("Add this to a dashboard in Tableau — it can't run in a plain browser tab.", true);
  }
})();

async function refresh() {
  const params = await dashboard.getParametersAsync();
  const ws = await pickWorksheet();
  const names = await columnNamesOf(ws);

  const ex = excludesFor(ws.name);
  let labels, lines, setLine = "";
  if (names) {
    const res = resolveHeaders(ws.name, names, params);
    const map = res.map;
    setLine = "\n\nPARAMETER SET\n  " + describeSet(res.set);
    const entries = names.filter(isSelectorField);
    labels = entries.filter(fn => !ex.columns.includes(fn))
      .map(fn => map[fn]?.label).filter(l => l && !isNone(l));
    lines = entries.map(fn =>
      "  [" + (map[fn]?.axis || "?") + "]  " + fn +
      "\n        <- " + (map[fn] ? map[fn].param +
        (map[fn].inferred ? "  (via parameter set)" : map[fn].exact ? "" : "  (only candidate)")
        : "no parameter, header stays as field name") +
      "\n        = " + (map[fn] ? (isNone(map[fn].label) ? "(none, dropped)" : map[fn].label) : "?") +
      (ex.columns.includes(fn) ? "  (excluded in Configure)" : ""));
    const sortFields = names.filter(isSortField);
    if (sortFields.length) {
      lines.push("\nSORT HELPERS (always dropped)\n" + sortFields.map(f => "  " + f).join("\n"));
    }
  } else {
    const lp = params.filter(p => isSelectorField(p.name));
    labels = lp.map(p => labelOf(p)).filter(l => l && !isNone(l));
    lines = lp.map(p => "  " + p.name + " = " + labelOf(p));
  }

  $("sub").textContent = labels.join(" · ") || "";

  setDiag(
    "DASHBOARD\n  " + dashboard.name +
    "\n\nGRID SHEET\n  " + ws.name +
    (names ? "" : "  (columns readable only at export time)") + setLine +
    "\n\nSELECTOR RESOLUTION\n" + (lines.join("\n") || "  none found — check AXES patterns") +
    "\n\nEXCLUDED IN CONFIGURE\n" +
      (ex.columns.length || ex.measures.length
        ? (ex.columns.length  ? "  columns:  " + ex.columns.join(", ")  + "\n" : "") +
          (ex.measures.length ? "  measures: " + ex.measures.join(", ") : "")
        : "  nothing, every column exports") +
    "\n\nALL PARAMETERS\n" + params.map(p =>
      "  " + p.name + " = " + p.currentValue.formattedValue).join("\n")
  );
}

// Long -> wide: one column per Measure Names value.
function pivotMeasures(keep, table, excludedMeasures = []) {
  const nameCol = keep.find(k => isMeasureNames(k.field));
  const valCol  = keep.find(k => isMeasureValues(k.field));
  if (!nameCol || !valCol) return null;

  // Rows are grouped on EVERY dimension, including ones excluded in Configure,
  // and excluded ones are only removed from the output afterwards. Dropping
  // e.g. Grid Index before grouping could make two rows share a key, and the
  // second would silently overwrite the first one's measures.
  const dims = keep.filter(k => k !== nameCol && k !== valCol);
  const outDims = dims.map((d, i) => ({ d, i })).filter(x => !x.d.excluded);
  const groups = new Map();      // insertion order preserves row order
  const seen = [];
  const decimalsSeen = {};       // measure -> decimal places, for Diagnostics

  table.data.forEach(row => {
    const dimVals = dims.map(d => {
      const c = row[d.index];
      return typeof c.nativeValue === "number" ? c.nativeValue : c.formattedValue;
    });
    const key = dimVals.join("\u0001");
    if (!groups.has(key)) groups.set(key, { dimVals, measures: {} });

    const mName = row[nameCol.index].formattedValue;
    const cell  = row[valCol.index];

    let v;
    if (typeof cell.nativeValue === "number") {
      // Match whatever precision Tableau is already displaying for this
      // measure — 2dp for a currency field, 0dp for a count, 4dp for an
      // RTP-style metric — read straight off the formatted string rather
      // than a fixed number, so it scales to any number of measures.
      const d = decimalsOf(cell.formattedValue);
      if (!(mName in decimalsSeen)) decimalsSeen[mName] = d;
      v = d == null ? cell.nativeValue : Number(cell.nativeValue.toFixed(d));
    } else {
      v = cell.formattedValue;
    }

    if (!seen.includes(mName)) seen.push(mName);
    groups.get(key).measures[mName] = v;
  });

  // seen is already in the order measures first appear in the view's data —
  // i.e. the Measure Values shelf order. MEASURE_ORDER only intervenes if
  // you've explicitly listed something in it.
  const ordered = [
    ...MEASURE_ORDER.filter(m => seen.includes(m)),
    ...seen.filter(m => !MEASURE_ORDER.includes(m))
  ].filter(m => !excludedMeasures.includes(m));

  return {
    header: [...outDims.map(x => x.d.header), ...ordered],
    rows: [...groups.values()].map(g =>
      [...outDims.map(x => g.dimVals[x.i]), ...ordered.map(m => g.measures[m] ?? null)]),
    order: ordered,
    droppedMeasures: seen.filter(m => excludedMeasures.includes(m)),
    decimalsSeen
  };
}

async function run() {
  $("go").disabled = true;
  setStatus("Reading view data…");

  try {
    const ws = await pickWorksheet();
    if (!ws) throw new Error("No worksheet found on this dashboard.");

    const reader = await ws.getSummaryDataReaderAsync();
    let table;
    try {
      table = await reader.getAllPagesAsync();
    } finally {
      await reader.releaseAsync();   // always release — it holds server resources
    }

    const params = await dashboard.getParametersAsync();
    const { map } = resolveHeaders(ws.name, table.columns.map(c => c.fieldName), params);
    const ex = excludesFor(ws.name);
    const isExcluded = f => ex.columns.includes(f) && !isMeasureNames(f) && !isMeasureValues(f);

    const keep = [];
    const droppedSort = [];
    table.columns.forEach(c => {
      if (DROP_FIELDS.includes(c.fieldName)) return;
      if (isSortField(c.fieldName)) { droppedSort.push(c.fieldName); return; }
      const hit = map[c.fieldName];
      if (hit) {
        if (isNone(hit.label)) return;                       // level set to None
        keep.push({ index: c.index, field: c.fieldName, header: hit.label, excluded: isExcluded(c.fieldName) });
      } else {
        keep.push({ index: c.index, field: c.fieldName, header: c.fieldName, excluded: isExcluded(c.fieldName) });
      }
    });
    if (!keep.length) throw new Error("No columns left to export — check Diagnostics.");

    let header, rows;
    const pivoted = PIVOT_MEASURES ? pivotMeasures(keep, table, ex.measures) : null;
    if (pivoted) {
      ({ header, rows } = pivoted);
    } else {
      const out = keep.filter(k => !k.excluded);
      header = out.map(k => k.header);
      rows = table.data.map(r => out.map(k => {
        const cell = r[k.index];
        return typeof cell.nativeValue === "number" ? cell.nativeValue : cell.formattedValue;
      }));
    }
    if (!header.length) {
      throw new Error("Every column is excluded for this sheet. Open Configure to include some.");
    }

    setDiag(diagText +
      "\n\nCOLUMNS IN \"" + ws.name + "\"\n" +
      table.columns.map(c => "  [" + c.index + "] " + c.fieldName +
        (isSortField(c.fieldName) ? "  (sort helper, dropped)" :
         isExcluded(c.fieldName) ? "  (excluded in Configure)" :
         map[c.fieldName] ? "  ->  " + (map[c.fieldName].label || "(none)") : "")).join("\n") +
      (pivoted
        ? "\n\nMEASURES DETECTED (view order, decimal places read from Tableau)\n" +
          pivoted.order.map(m => "  " + m + "  ->  " + pivoted.decimalsSeen[m] + " dp").join("\n") +
          (pivoted.droppedMeasures.length
            ? "\n  excluded in Configure: " + pivoted.droppedMeasures.join(", ") : "")
        : "") +
      "\n\nEXPORTED\n  " + header.join(" | ") +
      "\n  " + rows.length + " rows" + (pivoted ? " (measures pivoted)" : " (not pivoted)"));

    const stem = (FILE_STEM === "auto" ? dashboard.name : FILE_STEM).replace(/[^\w.-]+/g, "_");
    const name = stem + "_" + new Date().toISOString().slice(0, 10);

    if (typeof XLSX !== "undefined") {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([header, ...rows]), "Data");
      XLSX.writeFile(wb, name + ".xlsx");
    } else {
      downloadCsv([header, ...rows], name + ".csv");
    }

    setStatus("Exported " + rows.length.toLocaleString() + " rows.");
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    $("go").disabled = false;
  }
}

function downloadCsv(aoa, filename) {
  const esc = v => {
    const s = v == null ? "" : String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const blob = new Blob(["\uFEFF" + aoa.map(r => r.map(esc).join(",")).join("\r\n")],
                        { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
